[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whooshd"
version = "0.1.0rc3"
description = "Whoosh'd — Memory-aware local inference broker for Apple Silicon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

mlx = [
    "mlx-lm>=0.20.0",
]

[project.scripts]
whoosh = "whooshd.cli:main"
whooshd = "whooshd.cli:main"
whooshd-up = "whooshd.cli:up_main"
whooshd-down = "whooshd.cli:down_main"

[tool.hatch.build.targets.wheel]
packages = ["whooshd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
