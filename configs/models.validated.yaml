# Whoosh'd Model Registry — Validated Aliases
#
# Clean client-facing aliases for all validated runtime models.
# Load with: WHOOSHD_MODEL_REGISTRY_PATH=configs/models.validated.yaml
#
# These aliases are tested against real runtimes:
#   qwen2.5-0.5b-gguf  → llama.cpp / GGUF
#   llama-3.2-3b-mlx   → mlx_lm.server / MLX text
#   gemma-4-e2b-mlx    → mlx_lm.server / MLX text
#   qwen2-vl-2b-mlx    → mlx-vlm / MLX vision

models:
  # ── Validated GGUF (llama.cpp) model ────────────────────────────────
  qwen2.5-0.5b-gguf:
    display_name: "Qwen 2.5 0.5B GGUF (Q4_K_M)"
    engine: llama_cpp
    format: gguf
    path: "models/gguf/qwen2.5-0.5b-instruct-q4_k_m.gguf"
    modalities:
      - text
    context_window: 32768
    preferred_hardware:
      - metal
      - cpu
    warm_policy: warm_on_first_use
    priority: chat
    enabled: true
    tags:
      - gguf
      - local
      - small
      - qwen

  # ── Validated MLX text (mlx_lm.server) model ───────────────────────
  llama-3.2-3b-mlx:
    display_name: "Llama 3.2 3B Instruct 4-bit MLX"
    engine: mlx_lm
    format: mlx
    path: "mlx-community/Llama-3.2-3B-Instruct-4bit"
    modalities:
      - text
    context_window: 131072
    preferred_hardware:
      - apple_silicon
      - metal
    warm_policy: warm_on_first_use
    priority: chat
    enabled: true
    tags:
      - chat
      - mlx
      - local
      - small

  # ── Validated MLX text (mlx_lm.server) Gemma E2B model ─────────────
  gemma-4-e2b-mlx:
    display_name: "Gemma 4 E2B Instruct 4-bit MLX"
    engine: mlx_lm
    format: mlx
    path: "mlx-community/gemma-4-e2b-it-4bit"
    modalities:
      - text
    context_window: 131072
    preferred_hardware:
      - apple_silicon
      - metal
    warm_policy: warm_on_first_use
    priority: chat
    enabled: true
    tags:
      - chat
      - mlx
      - local
      - small
      - gemma

  # ── Validated MLX-VLM (vision) model ────────────────────────────────
  qwen2-vl-2b-mlx:
    display_name: "Qwen2 VL 2B Instruct 4-bit MLX"
    engine: mlx_vlm
    format: mlx
    path: "mlx-community/Qwen2-VL-2B-Instruct-4bit"
    modalities:
      - text
      - vision
    context_window: 32768
    preferred_hardware:
      - apple_silicon
      - metal
    warm_policy: warm_on_first_use
    priority: vision
    enabled: true
    tags:
      - vision
      - mlx
      - local
      - qwen
